# Hospedagem do Pingo no Netlify: site estático, sem etapa de build.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

# o service worker e o app precisam chegar sempre frescos
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/app/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/app/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/app/*"
  [headers.values]
    Cache-Control = "no-cache"

# o app mora em /app/ (o endereço sem a barra final também funciona)
[[redirects]]
  from = "/app"
  to = "/app/"
  status = 301

# código-fonte e scripts do banco não precisam ser servidos
[[redirects]]
  from = "/fonte/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/supabase/*"
  to = "/404"
  status = 404
  force = true
