<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F4BC7">

<title>Pingo — prática diária de matemática</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--azul:#2F4BC7;--azul-esc:#1E3399;--laranja:#F28C28;--laranja-sombra:#B35E12;--tinta:#1C2340;--cinza:#4A5375;--fundo:#F3F7FF;--verde:#1F7A45;--verde-claro:#EAF6EF;--creme:#FFF1E3;--marrom:#9A3412;--linha:#DDE2EE}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:var(--fundo);color:var(--tinta);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
body{overscroll-behavior:none}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
#app{min-height:100%;display:flex;flex-direction:column}
.tela{flex:1;display:flex;flex-direction:column;gap:20px;padding:max(24px,env(safe-area-inset-top)) max(clamp(16px,3.5vw,40px),env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(clamp(16px,3.5vw,40px),env(safe-area-inset-left));max-width:1280px;width:100%;margin:0 auto}
.topo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:10px;font-size:30px;font-weight:900;color:var(--azul);letter-spacing:-.5px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;background:#fff;border:0;border-radius:999px;padding:10px 16px;font-size:18px;font-weight:800;min-height:48px}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px;flex:1;align-items:start}
.heroi{min-height:min(560px,70vh)}
.cartao{color:var(--tinta);background:#fff;border-radius:28px;padding:clamp(20px,3vw,36px)}
.heroi{background:var(--azul);color:#fff;border-radius:32px;padding:clamp(24px,3.5vw,40px);display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.fala{background:#fff;color:var(--tinta);border-radius:24px 24px 24px 4px;padding:16px 20px;font-size:21px;font-weight:700;line-height:1.35}
h1{margin:0;font-size:clamp(34px,4.5vw,46px);font-weight:900;line-height:1.08}
h2{margin:0;font-size:28px;font-weight:900}
.rotulo{margin:0;font-size:15px;font-weight:800;color:var(--cinza);text-transform:uppercase;letter-spacing:1px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:20px;padding:18px 26px;font-size:24px;font-weight:900;min-height:64px;text-decoration:none}
.btn-laranja{background:var(--laranja);color:var(--tinta);box-shadow:0 6px 0 var(--laranja-sombra)}
.btn-laranja:active{transform:translateY(4px);box-shadow:0 2px 0 var(--laranja-sombra)}
.btn-verde{background:var(--verde);color:#fff}
.btn-claro{background:#EEF2FC;color:var(--tinta);box-shadow:0 4px 0 #C9D2EA}
.btn-claro:active{transform:translateY(3px);box-shadow:0 1px 0 #C9D2EA}
.btn-pequeno{font-size:17px;min-height:48px;padding:10px 16px;border-radius:14px}
.btn:disabled{opacity:.5;cursor:default}
.trilha{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.trilha{grid-template-columns:repeat(2,minmax(0,1fr))}}
.trilha li{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:18px;background:#F1F3F8;min-height:128px}
.trilha li.feito{background:var(--verde-claro)}
.trilha li.atual{background:var(--creme);outline:3px solid var(--laranja)}
.bola{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;background:var(--linha);color:var(--cinza);flex:none}
.feito .bola{background:var(--verde);color:#fff}
.atual .bola{background:var(--laranja);color:var(--tinta)}
.trilha .nome{font-size:18px;font-weight:800}
.trilha .status{font-size:15px;font-weight:800}
.link-pais{align-self:center;background:none;border:0;color:var(--cinza);font-size:16px;font-weight:800;display:flex;gap:8px;align-items:center;min-height:44px;padding:8px 14px}
/* folha */
.barra{display:flex;align-items:center;gap:16px}
.progresso{flex:1;display:flex;flex-direction:column;gap:8px}
.progresso .linha{display:flex;justify-content:space-between;font-size:17px;font-weight:800}
.pontos{display:flex;gap:8px}
.pontos span{flex:1;height:12px;border-radius:999px;background:var(--linha)}
.pontos .ok{background:var(--verde)}.pontos .erro{background:#E8A25F}.pontos .agora{background:var(--laranja)}
.icone{width:52px;height:52px;border-radius:16px;background:#fff;border:0;display:flex;align-items:center;justify-content:center;flex:none}
.folha{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:20px;flex:1}
@media (max-width:860px){.folha{grid-template-columns:1fr}}
.quadro{background:#fff;border-radius:32px;padding:clamp(18px,3vw,36px);display:flex;flex-direction:column;gap:20px;justify-content:space-between}
.conta{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:clamp(10px,2vw,24px);font-size:clamp(64px,10vw,124px);font-weight:900;line-height:1}
.conta.grande{font-size:clamp(52px,7.5vw,96px)}
.conta .op{color:var(--laranja)}.conta .igual{color:var(--cinza)}
.pad{position:relative;width:clamp(200px,30vw,360px);height:clamp(150px,21vw,240px);border:4px dashed var(--azul);border-radius:24px;touch-action:none;background:#FBFCFF}
.pad.larga{width:clamp(260px,40vw,460px)}
.pad.ok{border-color:var(--verde);border-style:solid}.pad.erro{border-color:#C2410C}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:20px}
.pad .dica-pad{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#8A93B0;pointer-events:none;text-align:center;padding:12px}
.visor{width:clamp(180px,24vw,300px);height:clamp(130px,18vw,200px);border:4px dashed var(--azul);border-radius:24px;display:flex;align-items:center;justify-content:center}
.aviso{display:flex;align-items:center;gap:14px;border-radius:22px;padding:16px 20px;font-size:18px;font-weight:700;flex-wrap:wrap}
.aviso .txt{flex:1;min-width:200px}
.aviso p{margin:0}
.aviso .tit{font-size:24px;font-weight:900}
.aviso-ok{background:var(--verde-claro)}.aviso-ok .tit{color:var(--verde)}
.aviso-erro{background:var(--creme)}.aviso-erro .tit{color:var(--marrom)}
.aviso-neutro{background:#EEF2FC}
.instrucao{margin:0;text-align:center;font-size:18px;font-weight:700;color:var(--cinza)}
.lado{background:#fff;border-radius:32px;padding:24px;display:flex;flex-direction:column;gap:14px}
.teclado{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.teclado button{height:76px;font-size:36px}
.balanca{animation:balanca .35s}
@keyframes balanca{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
/* fim */
.fim{background:var(--azul);color:#fff}
.fim .tela{justify-content:center}
.estrelas{display:flex;gap:10px;align-items:flex-end;justify-content:center}
.semana{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:14px;font-weight:800;color:var(--cinza)}
.semana div{display:flex;flex-direction:column;align-items:center;gap:6px}
.semana i{width:38px;height:38px;border-radius:50%;background:#E4E8F2;display:block}
.semana i.sim{background:var(--laranja)}
/* pais */
.pais .tela{max-width:900px}
.campo{display:flex;flex-direction:column;gap:6px;font-size:16px;font-weight:800}
.campo input{-webkit-user-select:text;user-select:text;font-size:22px;font-weight:800;padding:12px 14px;border:2px solid var(--linha);border-radius:14px;min-height:52px;background:#fff}
.campo input:focus{outline:3px solid var(--azul);border-color:var(--azul)}
.metricas{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.metrica{background:rgba(255,255,255,.14);border-radius:16px;padding:12px}
.metrica b{display:block;font-size:26px;font-weight:900}
.metrica span{font-size:14px;font-weight:700}
.lista{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px}
.item .tag{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.item .info{flex:1}
.item .info p{margin:0}
.peq{font-size:14px;font-weight:700;color:var(--cinza)}
.abas{display:flex;gap:8px;flex-wrap:wrap}
.aba{border:2px solid var(--linha);background:#fff;border-radius:999px;padding:8px 16px;font-size:16px;font-weight:800;min-height:44px}
.aba.sel{background:var(--azul);border-color:var(--azul);color:#fff}
.usuarios{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.usuarios li{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid var(--linha)}
.usuarios li:first-child{border-top:0}
.usu-info{display:flex;flex-direction:column;gap:4px;min-width:0}
.usu-info b{font-size:17px;font-weight:800;overflow-wrap:anywhere}
.selo{align-self:flex-start;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800}
.selo-ok{background:var(--verde-claro);color:var(--verde)}.selo-cortesia{background:#E8ECFF;color:var(--azul-esc)}
.selo-adm{background:var(--creme);color:var(--marrom)}.selo-alerta{background:#FFF4D6;color:#7A5300}.selo-off{background:#EEF0F5;color:var(--cinza)}
.chave{flex:none;width:60px;height:36px;border-radius:999px;border:0;background:#C9CFDD;position:relative;padding:0;transition:background .15s}
.chave span{position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.chave.on{background:var(--verde)}.chave.on span{left:28px}
.chave:disabled{opacity:.5}
.chave:focus-visible,.aba:focus-visible{outline:3px solid var(--laranja);outline-offset:2px}
.confirma{display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:260px;font-size:14px;font-weight:700;color:var(--marrom);text-align:right}
.confirma .btn{width:100%}
.cores{display:flex;gap:10px}
.cores label{position:relative}
.cores input{position:absolute;opacity:0;width:1px;height:1px}
.cores span{display:block;width:44px;height:44px;border-radius:50%;border:3px solid transparent}
.cores input:checked+span{border-color:var(--tinta);outline:2px solid #fff;outline-offset:-5px}
.cores input:focus-visible+span{outline:3px solid var(--azul)}
.perfis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.perfil{background:#fff;border:0;border-radius:28px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;font-size:24px;font-weight:900;min-height:170px}
.perfil .avatar{width:80px;height:80px;font-size:36px}
.modal{position:fixed;inset:0;background:rgba(28,35,64,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .caixa{background:#fff;border-radius:28px;padding:24px;max-width:760px;width:100%;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:16px}
.planos{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.planos legend{margin-bottom:8px}
.plano{display:flex;gap:14px;align-items:flex-start;border:3px solid var(--linha);border-radius:20px;padding:14px 16px;cursor:pointer;background:#fff}
.plano:has(input:checked){border-color:var(--azul,#2F4BC7);background:#F3F6FF}
.plano input{width:24px;height:24px;flex:none;margin-top:4px;accent-color:#2F4BC7}
.plano-txt{display:flex;flex-direction:column;gap:2px;font-size:17px}
.plano-txt b{font-size:19px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plano-preco{font-size:28px;font-weight:900}
.plano-preco small{font-size:16px;font-weight:800;color:#4A5375}
.aviso-fundador{background:#FFF1E0;border:2px solid #F2B36B;color:#5E3300}
.replays{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.replay{border:2px solid var(--linha);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px}
.replay canvas{width:100%;height:120px;background:#FBFCFF;border-radius:12px}
.ok-txt{color:var(--verde);font-weight:900}.erro-txt{color:var(--marrom);font-weight:900}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.aceite{display:flex;gap:12px;align-items:flex-start;font-size:16px;font-weight:700;line-height:1.45}
.aceite input{width:26px;height:26px;flex:none;margin-top:2px}
.aceite a{color:var(--azul);font-weight:800}
.linkbtn{background:none;border:0;padding:0;color:var(--azul);font:inherit;font-weight:800;text-decoration:underline;cursor:pointer}
.btn-perigo{background:#C2410C;color:#fff}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
</style>
<script src="../config.js"></script>
<script src="../vendor/supabase.js"></script>
</head>

  if (op === '-') {
    if (a <= 20) return 'Dica: comece no ' + a + ' e volte ' + b + '. Ou pense: ' + b + ' mais quanto dá ' + a + '?';
    if (a % 10 < b % 10) return 'Dica: comece pelas unidades. ' + (a % 10) + ' é menor que ' + (b % 10) + ', então pegue 1 dezena emprestada: vira ' + (a % 10 + 10) + ' − ' + (b % 10) + '.';
    return 'Dica: tire as unidades primeiro (' + (a % 10) + ' − ' + (b % 10) + ') e depois as dezenas.';
  }
  const s = a + b, g = Math.max(a, b), q = Math.min(a, b);
  if (s <= 20) {
    if (s > 10 && g < 10) { const f = 10 - g; return 'Dica: complete o 10. ' + g + ' + ' + f + ' = 10, e ainda faltam ' + (q - f) + '.'; }
    return 'Dica: comece no ' + g + ' e conte mais ' + q + (q <= 5 ? ' nos dedinhos.' : '.');
  }
  if (a % 10 + b % 10 >= 10) return 'Dica: some as unidades: ' + (a % 10) + ' + ' + (b % 10) + ' = ' + (a % 10 + b % 10) + '. Fica o ' + ((a + b) % 10) + ' e vai um para as dezenas.';
  return 'Dica: some as unidades (' + (a % 10) + ' + ' + (b % 10) + ') e depois as dezenas.';
}

/* ---------- Quadro de escrita ---------- */
let canetaVista = false;
function montarPad() {
  const pad = document.getElementById('pad'); if (!pad) return;
  const cv = pad.querySelector('canvas'), ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  function dim() { const r = pad.getBoundingClientRect(); padTam = { w: r.width, h: r.height }; cv.width = r.width * dpr; cv.height = r.height * dpr; desenhar(); }
  function desenhar() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, padTam.w, padTam.h);
    ctx.strokeStyle = '#1C2340'; ctx.fillStyle = '#1C2340'; ctx.lineWidth = Math.max(7, padTam.h * 0.045); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const s of tracos) {
      const p = toPx(s, padTam.w, padTam.h);
      if (p.length === 1) { ctx.beginPath(); ctx.arc(p[0][0], p[0][1], ctx.lineWidth / 2, 0, 7); ctx.fill(); continue; }
      ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]); ctx.stroke();
    }
  }
  dim();
  const trava = () => licao && (licao.status === 'ok' || licao.status === 'revela' || licao.status === 'duvida');
  let atual = null, idPonteiro = null;
  function pt(e) { const r = cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * 1000), Math.round((e.clientY - r.top) / r.height * 1000), Date.now() - licao.inicioItem]; }
  cv.addEventListener('pointerdown', e => {
    if (trava()) return;
    if (e.pointerType === 'pen') canetaVista = true;
    if (canetaVista && e.pointerType === 'touch') return; // rejeição de palma
    if (idPonteiro !== null) return;
    e.preventDefault(); cv.setPointerCapture(e.pointerId); idPonteiro = e.pointerId;
    if (licao.status === 'erro' || licao.status === 'aviso') { licao.status = 'escrever'; const av = app.querySelector('.aviso'); if (av) av.outerHTML = '<p class="instrucao">Escreva o resultado no quadradinho e toque em Conferir.</p>'; pad.classList.remove('erro'); }
    const dp = pad.querySelector('.dica-pad'); if (dp) dp.remove();
    atual = [pt(e)]; tracos.push(atual); desenhar();
  });
  cv.addEventListener('pointermove', e => {
    if (e.pointerId !== idPonteiro || !atual) return;
    const ev = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const x of ev) atual.push(pt(x));
    desenhar();
  });
  const fim = e => { if (e.pointerId !== idPonteiro) return; idPonteiro = null; atual = null; };
  cv.addEventListener('pointerup', fim); cv.addEventListener('pointercancel', fim);
  window.onresize = () => { if (document.getElementById('pad') === pad) dim(); };
}

function avaliar(valor) {

  else if (L.tentativas.length >= 3) { L.status = 'revela'; falar(falaConta(p) + ' é ' + soma); }
  else { L.status = 'erro'; tracos = []; L.digitado = ''; falar('Quase! Vamos de novo?'); }
  render();
}

  if (passou && L.hab === c.hab && c.nivel < etapa(c.hab).licoes) {
    c.nivel++;
    if (c.nivel >= etapa(c.hab).licoes) { if (c.hab < ETAPAS.length - 1) { const b0 = etapa(c.hab).bloco; c.hab++; c.nivel = 0; novoBloco = etapa(c.hab).bloco !== b0; } else terminouTudo = true; subiu = true; }
    marcar(c);
  }
  c.historico.push({ id: novoId('lic'), ts: Date.now(), dia: d, hab: L.hab, itens: L.itens, ms: Date.now() - L.inicio, estrelas, sinc: false });
  recalcular(c); salvar(); agendarSinc(400);
  fimInfo = { deprimeira: dp, estrelas, passou, subiu, terminouTudo, novoBloco };
  licao = null; tracos = [];
  ir('fim');
  falar('Lição feita! Você ganhou ' + estrelas + (estrelas === 1 ? ' estrela' : ' estrelas'));
}

/* ---------- Replay ---------- */
function abrirReplay(id) {
  const c = db.criancas.find(x => x.id === paisAba); const l = c && c.historico.find(x => x.id === id); if (!l) return;
  modal = function () {
    return '<div class="modal" role="dialog" aria-modal="true" aria-label="Replay da lição"><div class="caixa"><div class="topo"><h2 style="font-size:22px">Replay · ' + esc(etapa(l.hab).nome) + ' · ' + dataBonita(l.dia) + '</h2><button class="btn btn-claro btn-pequeno" data-act="fecharModal" data-foco>Fechar</button></div>' +
      '<div class="replays">' + l.itens.map((it, i) => {
        const ult = it.tentativas[it.tentativas.length - 1];
        return '<div class="replay"><p style="margin:0;font-size:18px;font-weight:900">' + textoConta(it) + ' = ' + resultado(it) + '</p>' +
          (ult && ult.t && ult.t.length ? '<canvas data-rp="' + i + '"></canvas>' : '<p class="peq" style="margin:0">' + (ult ? 'Respondeu pelo teclado: ' + ult.v : 'Sem traçado salvo') + '</p>') +
          '<p class="peq" style="margin:0">' + (it.deprimeira ? '<span class="ok-txt">Acertou de primeira</span>' : it.acertou ? '<span class="erro-txt">Acertou na ' + it.tentativas.length + 'ª tentativa</span>' : '<span class="erro-txt">Não acertou</span>') +
          ' · respostas: ' + it.tentativas.map(t => t.v).join(', ') + ' · ' + Math.round(it.ms / 1000) + ' s</p></div>';
      }).join('') + '</div><button class="btn btn-laranja btn-pequeno" data-act="replayDeNovo">Ver de novo</button></div></div>';
  };
  modal.depois = function () {
    app.querySelectorAll('canvas[data-rp]').forEach(cv => {
      const it = l.itens[Number(cv.dataset.rp)], t = it.tentativas[it.tentativas.length - 1];
      const dpr = window.devicePixelRatio || 1, r = cv.getBoundingClientRect(); cv.width = r.width * dpr; cv.height = r.height * dpr;
      const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const h = r.height, w = Math.min(r.width, h * (t.r || 1.5)), ox = (r.width - w) / 2;
      const t0 = Math.min.apply(null, t.t.map(s => s[0] ? s[0][2] : 1e12));
      const tf = Math.max.apply(null, t.t.map(s => s.length ? s[s.length - 1][2] : 0));
      const ini = performance.now();
      (function quadro(now) {
        const el = Math.min((now - ini) * 1.5 + t0, tf);
        ctx.clearRect(0, 0, r.width, h); ctx.strokeStyle = '#2F4BC7'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        for (const s of t.t) { const vis = s.filter(p => p[2] <= el); if (!vis.length) continue; ctx.beginPath(); ctx.moveTo(ox + vis[0][0] * w / 1000, vis[0][1] * h / 1000); for (const p of vis) ctx.lineTo(ox + p[0] * w / 1000, p[1] * h / 1000); ctx.stroke(); }
        if (el < tf && document.body.contains(cv)) requestAnimationFrame(quadro);
      })(ini);
    });
  };
  render();
}

/* ---------- Ações ---------- */
const ACOES = {
  escolher: d => { db.ativa = d.id; salvar(); ir('inicio'); },
  trocar: () => ir('perfis'),
  voltarPerfis: () => ir(db.criancas.length ? (paisAba ? 'pais' : 'perfis') : 'boasvindas'),
  comecar: () => { licao = novaLicao(crianca()); tracos = []; ir('folha'); falar('Quanto é ' + falaConta(licao.probs[0]) + '?'); },
  ouvir: () => { const p = licao.probs[licao.i]; falar('Quanto é ' + falaConta(p) + '?'); },
  apagar: () => { const L = licao; if (crianca().teclado) L.digitado = L.digitado.slice(0, -1); else tracos = []; if (L.status !== 'ok') L.status = 'escrever'; render(); },
  tecla: d => { const L = licao; L.digitado = (L.digitado + d.k).slice(-3); L.status = 'escrever'; render(); },
  modo: () => { const c = crianca(); c.teclado = !c.teclado; marcar(c); salvar(); agendarSinc(); tracos = []; licao.digitado = ''; licao.status = 'escrever'; render(); },
  conferir: () => {
    const L = licao, c = crianca();
    if (c.teclado) { if (!L.digitado) return aviso('Toque nos números primeiro.'); return avaliar(Number(L.digitado)); }
    if (!tracos.length) return aviso('Escreva o número primeiro, bem grandão.');
    const r = recognize(tracos, padTam.w, padTam.h);
    if (!r) return aviso('Escreva o número primeiro, bem grandão.');
    if (r.erro) { tracos = []; return aviso('Escreva só um número, com os algarismos lado a lado.'); }
    if (r.conf < 0.6) { L.status = 'duvida'; L.valorDuvida = r; return render(); }
    avaliar(r.valor);
  },
  duvidaSim: () => { avaliar(licao.valorDuvida.valor); },
  duvidaNao: () => { tracos = []; licao.status = 'escrever'; render(); },
  proxima: () => {
    fecharItem(); const L = licao;
    if (L.i >= L.probs.length - 1) return terminarLicao();
    L.i++; L.tentativas = []; L.status = 'escrever'; L.digitado = ''; L.inicioItem = Date.now(); tracos = []; render();
    falar('Quanto é ' + falaConta(L.probs[L.i]) + '?');
  },
  sair: () => { licao = null; tracos = []; ir('inicio'); },
  inicio: () => ir('inicio'),
  abrirPais: () => { const a = 6 + Math.floor(Math.random() * 4), b = 6 + Math.floor(Math.random() * 4); desafio = { a, b, erro: false }; ir('portao'); },
  voltarCrianca: () => { confirmaApagar = false; ir(telaInicial()); },
  abaPais: d => { paisAba = d.id; confirmaApagar = false; render(); },
  novaCrianca: () => ir('novo'),
  replay: d => abrirReplay(d.id),
  replayDeNovo: () => { if (modal && modal.depois) modal.depois(); },
  fecharModal: () => { modal = null; render(); },
  toggleTeclado: () => { const c = db.criancas.find(x => x.id === paisAba); c.teclado = !c.teclado; marcar(c); salvar(); agendarSinc(); render(); },
  reiniciar: () => { const c = db.criancas.find(x => x.id === paisAba); c.hab = 0; c.nivel = 0; c.reinicio = Date.now(); marcar(c); salvar(); agendarSinc(); render(); },
  pedeApagar: () => { confirmaApagar = true; render(); },
  cancelaApagar: () => { confirmaApagar = false; render(); },
  abrirConta: d => { contaModo = d.m || 'entrar'; contaMsg = null; contaSenha = ''; contaOk = false; contaVolta = tela === 'pais' ? 'pais' : 'inicio'; ir('conta'); },
  contaModo: d => { guardarForm(); contaModo = d.m; contaMsg = null; render(); },
  contaVoltar: () => { contaMsg = null; contaSenha = ''; if (contaVolta === 'pais' && db.criancas.length && logado()) ir('pais'); else ir(telaInicial()); },
  privacidade: () => { guardarForm(); try { window.open('../privacidade.html', '_blank', 'noopener'); } catch (e) { location.href = '../privacidade.html'; } },
  termos: () => { guardarForm(); try { window.open('../termos.html', '_blank', 'noopener'); } catch (e) { location.href = '../termos.html'; } },
  sincAgora: () => { sincronizar(); atualizarSelo(); },
  assinar: () => { const f = app.querySelector('form[data-form=assinar]'); if (f) { if (f.requestSubmit) f.requestSubmit(); else enviarAssinar(new FormData(f)); } },
  portal: async () => {
    pagamento = { estado: 'indo', msg: null }; render();
    try { const r = await NUVEM.funcao('assinatura', { acao: 'portal' }); if (r && r.url) { location.href = r.url; return; } throw new Error('Resposta sem endereço do portal.'); }
    catch (e) { pagamento = { estado: null, msg: e.daFuncao ? e.message : traduzErro(e) }; render(); }
  },
  verificarAssinatura: () => { if (!db.cobranca) { atualizarCobranca().then(() => ir(telaInicial())); } else confirmarPagamento(); },
  abrirAdmin: () => { adminDados = null; adminMsg = null; adminUsuarios = null; adminUsuMsg = null; adminConfirmar = null; ir('admin'); carregarAdmin(); },
  adminFiltro: d => { adminFiltro = d.f; adminConfirmar = null; render(); },
  adminCancelaConfirma: () => { adminConfirmar = null; render(); },
  adminAcesso: d => {
    if (adminMexendo) return;
    const ativo = d.ativo === '1', u = (adminUsuarios || []).find(x => x.id === d.id);
    if (!ativo && u && u.pago && !d.ok) { adminConfirmar = d.id; adminUsuMsg = null; return render(); }
    mudarAcesso(d.id, ativo);
  },
  voltarPais: () => { adminMsg = null; ir('pais'); },
  adminConectar: async () => {
    adminOcupado = true; adminMsg = null; render();
    try { adminDados = await NUVEM.funcao('admin-cobranca', { acao: 'conectar' }); adminMsg = { ok: true, t: 'Stripe conectada: produto, preço, portal do cliente e avisos automáticos prontos.' }; await atualizarCobranca(); }
    catch (e) { adminMsg = { t: e.daFuncao ? e.message : traduzErro(e) }; }
    adminOcupado = false; if (tela === 'admin') render();
  },
  pedeSair: () => { confirmaExcluir = false; modal = modalSair; render(); },
  cancelaSair: () => { confirmaSair = false; render(); },
  sairConta: async () => {
    const b = app.querySelector('[data-act=sairConta]'); if (b) { b.disabled = true; b.textContent = 'Saindo…'; }
    if (pendentes() && navigator.onLine !== false) { try { await sincronizar(); } catch (e) { } }
    try { if (NUVEM) await NUVEM.sair(); } catch (e) { }
    limparAparelho(); modal = null; contaModo = 'entrar'; contaSenha = ''; contaMsg = { ok: true, t: 'Você saiu da conta. O progresso continua guardado na nuvem.' }; ir('conta');
  },
  pedeExcluir: () => { confirmaExcluir = true; confirmaSair = false; render(); },
  cancelaExcluir: () => { confirmaExcluir = false; render(); },
  excluirConta: async () => {
    try { await NUVEM.excluirConta(); limparAparelho(); confirmaExcluir = false; contaModo = 'entrar'; contaEmail = ''; contaMsg = { ok: true, t: 'Conta excluída. Todos os dados foram apagados.' }; ir('conta'); }
    catch (e) { db.erroSinc = traduzErro(e); db.estadoSinc = 'erro'; confirmaExcluir = false; render(); }
  },
  apagarCrianca: () => { const ap = db.criancas.find(x => x.id === paisAba); if (ap && ap.sinc) db.apagadas.push(ap.id); agendarSinc(0); db.criancas = db.criancas.filter(x => x.id !== paisAba); if (db.ativa === paisAba) db.ativa = null; paisAba = null; confirmaApagar = false; salvar(); db.criancas.length ? render() : ir('boasvindas'); }
};
function guardarForm() {
  const e = app.querySelector('input[name=email]'), s2 = app.querySelector('input[name=senha]'), ok = app.querySelector('input[name=ok]');
  if (e) contaEmail = e.value.trim(); if (s2) contaSenha = s2.value; if (ok) contaOk = ok.checked;
}
async function enviarConta(fd) {
  const email = String(fd.get('email') == null ? contaEmail : fd.get('email')).trim(), senha = String(fd.get('senha') || '');
  contaEmail = email; contaSenha = senha; contaOk = !!fd.get('ok');
  if (contaModo !== 'novaSenha' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { contaMsg = { t: 'Digite um e-mail válido.' }; return render(); }
  if (contaModo !== 'recuperar' && senha.length < 8) { contaMsg = { t: 'A senha precisa ter pelo menos 8 caracteres.' }; return render(); }
  if (contaModo === 'criar' && !contaOk) { contaMsg = { t: 'Marque a autorização do responsável para continuar.' }; return render(); }
  contaOcupado = true; contaMsg = null; render();
  let entrou = false;
  try {
    if (contaModo === 'entrar') { const u = await NUVEM.entrar(email, senha); conectar(u, true); entrou = true; }
    else if (contaModo === 'criar') { const r = await NUVEM.criarConta(email, senha); if (r.usuario) { conectar(r.usuario, true); entrou = true; } else contaModo = 'confirmar'; }
    else if (contaModo === 'recuperar') { await NUVEM.recuperar(email); contaMsg = { ok: true, t: 'Se esse e-mail tiver conta, enviamos um link para criar uma senha nova.' }; }
    else if (contaModo === 'novaSenha') { await NUVEM.novaSenha(senha); const u = await NUVEM.sessao(); if (u) { conectar(u, true); entrou = true; } }
  } catch (e) { contaMsg = { t: traduzErro(e) }; }
  contaOcupado = false; contaSenha = '';
  if (entrou) { await atualizarCobranca(); await sincronizar(); contaMsg = null; ir(telaInicial()); return; }
  if (tela === 'conta') render();
}
function aviso(m) { licao.status = 'aviso'; licao.msg = m; render(); const q = app.querySelector('.quadro'); if (q) q.classList.add('balanca'); }

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.type === 'checkbox') { ACOES[el.dataset.act] && ACOES[el.dataset.act](el.dataset, el); return; }
  e.preventDefault(); const f = ACOES[el.dataset.act]; if (f) f(el.dataset, el);
});
app.addEventListener('input', e => {
  const t = e.target;
  if (t.name === 'cpf' && t.closest('form[data-form=assinar]')) { const m = mascaraCpf(t.value); if (m !== t.value) t.value = m; assinarCpf = m; }
});
app.addEventListener('change', e => { if (e.target.name === 'plano') assinarPlano = e.target.value; });
app.addEventListener('submit', e => {
  e.preventDefault(); const fd = new FormData(e.target);
  if (e.target.dataset.form === 'perfil') {
    const nome = String(fd.get('nome') || '').trim().slice(0, 20); if (!nome) return;
    db.consentimento = true;
    const c = { id: novoId('cri'), nome, cor: String(fd.get('cor') || CORES[0]), hab: 0, nivel: 0, estrelas: 0, estrelasArq: 0, sequencia: 0, ultimoDia: null, teclado: false, reinicio: 0, atualizado: Date.now(), sujo: true, sinc: false, historico: [] };
    db.criancas.push(c); db.ativa = c.id; salvar(); agendarSinc(0); paisAba = null; ir('inicio');
  } else if (e.target.dataset.form === 'aceite') { enviarAceite(fd);
  } else if (e.target.dataset.form === 'conta') { enviarConta(fd);
  } else if (e.target.dataset.form === 'admin') { enviarAdmin(fd);
  } else if (e.target.dataset.form === 'assinar') { enviarAssinar(fd);
  } else if (e.target.dataset.form === 'portao') {
    if (Number(fd.get('r')) === desafio.a * desafio.b) { paisAba = db.ativa || (db.criancas[0] && db.criancas[0].id); ir('pais'); }
    else { desafio = { a: 6 + Math.floor(Math.random() * 4), b: 6 + Math.floor(Math.random() * 4), erro: true }; render(); }
  }
});
app.addEventListener('keydown', e => { if (e.key === 'Escape' && modal) { modal = null; render(); } });

window.PINGO_TEST = { recognize, rasterize, NET, novaLicao, dica, mesclar, temAcesso, ETAPAS, BLOCOS, resultado, salvar, get db() { return db; } };
window.addEventListener('online', () => agendarSinc(200));
window.addEventListener('offline', () => { db.estadoSinc = 'offline'; atualizarSelo(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') agendarSinc(1000); });
checarRetornoPagamento();
render();
iniciarNuvem();
if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
