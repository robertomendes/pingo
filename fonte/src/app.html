<script>
'use strict';
const MODEL = __MODEL__;

/* ---------- Reconhecimento de dígitos (rede neural no aparelho) ---------- */
const NET = (function () {
  function dec(b64) { const s = atob(b64); const a = new Int8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = (s.charCodeAt(i) << 24) >> 24; return a; }
  const H = MODEL.h, w1 = dec(MODEL.w1), w2 = dec(MODEL.w2), s1 = MODEL.s1, s2 = MODEL.s2, b1 = MODEL.b1, b2 = MODEL.b2;
  return function predict(x) {
    const h = new Float32Array(H);
    for (let i = 0; i < 784; i++) { const v = x[i]; if (!v) continue; const o = i * H; for (let j = 0; j < H; j++) h[j] += v * w1[o + j]; }
    for (let j = 0; j < H; j++) { h[j] = h[j] * s1 + b1[j]; if (h[j] < 0) h[j] = 0; }
    const out = new Float32Array(10);
    for (let j = 0; j < H; j++) { const v = h[j]; if (!v) continue; const o = j * 10; for (let k = 0; k < 10; k++) out[k] += v * w2[o + k]; }
    let mx = -1e9; for (let k = 0; k < 10; k++) { out[k] = out[k] * s2 + b2[k]; if (out[k] > mx) mx = out[k]; }
    let sum = 0; for (let k = 0; k < 10; k++) { out[k] = Math.exp(out[k] - mx); sum += out[k]; }
    let best = 0; for (let k = 0; k < 10; k++) { out[k] /= sum; if (out[k] > out[best]) best = k; }
    return { digit: best, p: out[best] };
  };
})();

const off = document.createElement('canvas'); off.width = off.height = 112;
const offCtx = off.getContext('2d', { willReadFrequently: true });

function toPx(s, w, h) { return s.map(p => [p[0] * w / 1000, p[1] * h / 1000]); }

function rasterize(strokes) { // strokes em px; devolve 784 valores no estilo MNIST
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const s of strokes) for (const p of s) { if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0]; if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1]; }
  const bw = Math.max(x1 - x0, 1), bh = Math.max(y1 - y0, 1), sc = 80 / Math.max(bw, bh);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  offCtx.clearRect(0, 0, 112, 112);
  offCtx.lineWidth = 9; offCtx.lineCap = 'round'; offCtx.lineJoin = 'round'; offCtx.strokeStyle = '#000'; offCtx.fillStyle = '#000';
  for (const s of strokes) {
    const pts = s.map(p => [56 + (p[0] - cx) * sc, 56 + (p[1] - cy) * sc]);
    if (pts.length === 1) { offCtx.beginPath(); offCtx.arc(pts[0][0], pts[0][1], 4.5, 0, 7); offCtx.fill(); continue; }
    offCtx.beginPath(); offCtx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) offCtx.lineTo(pts[i][0], pts[i][1]);
    offCtx.stroke();
  }
  const d = offCtx.getImageData(0, 0, 112, 112).data;
  const g = new Float32Array(784);
  for (let y = 0; y < 28; y++) for (let x = 0; x < 28; x++) {
    let a = 0; for (let dy = 0; dy < 4; dy++) for (let dx = 0; dx < 4; dx++) a += d[((y * 4 + dy) * 112 + x * 4 + dx) * 4 + 3];
    g[y * 28 + x] = a / (16 * 255);
  }
  let m = 0, mx = 0, my = 0;
  for (let y = 0; y < 28; y++) for (let x = 0; x < 28; x++) { const v = g[y * 28 + x]; m += v; mx += v * x; my += v * y; }
  if (!m) return g;
  const sx = Math.round(14 - mx / m), sy = Math.round(14 - my / m);
  const o = new Float32Array(784);
  for (let y = 0; y < 28; y++) for (let x = 0; x < 28; x++) { const ny = y + sy, nx = x + sx; if (ny >= 0 && ny < 28 && nx >= 0 && nx < 28) o[ny * 28 + nx] = g[y * 28 + x]; }
  return o;
}

function recognize(strokes, w, h) {
  const boxes = strokes.map(s => toPx(s, w, h)).map(s => {
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (const p of s) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
    return { s, x0, x1, y0, y1 };
  }).filter(b => Math.hypot(b.x1 - b.x0, b.y1 - b.y0) > h * 0.04 || b.s.length > 3).sort((a, b) => a.x0 - b.x0);
  if (!boxes.length) return null;
  const groups = [];
  for (const b of boxes) {
    const g = groups[groups.length - 1];
    if (g) {
      const ov = Math.min(g.x1, b.x1) - Math.max(g.x0, b.x0);
      const minw = Math.max(Math.min(g.x1 - g.x0, b.x1 - b.x0), 6);
      if (ov > 0.2 * minw || ov > -0.01 * w && (b.x1 - b.x0) < 0.35 * (b.y1 - b.y0 + 1) && b.x0 < g.x1 + 2) { g.s.push(b.s); g.x0 = Math.min(g.x0, b.x0); g.x1 = Math.max(g.x1, b.x1); continue; }
    }
    groups.push({ s: [b.s], x0: b.x0, x1: b.x1 });
  }
  if (groups.length > 3) return { erro: 'muitos' };
  let txt = '', conf = 1;
  for (const g of groups) { const r = NET(rasterize(g.s)); txt += r.digit; conf *= r.p; }
  return { valor: Number(txt), texto: txt, conf };
}

/* ---------- Dados: ficam no aparelho e, com conta, têm cópia na nuvem ---------- */
const CHAVE = 'pingo.v1';
const TERMOS_VERSAO = '2026-11-25'; // mude a data quando os Termos ou a Política mudarem: todos aceitam de novo
const MAX_LICOES = 400;
let memoria = null;
function novoId(p) { try { if (window.crypto && crypto.randomUUID) return p + '-' + crypto.randomUUID(); } catch (e) { } return p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
function carregar() {
  let d = null;

const OPS = { '+': { s: '+', fala: 'mais', f: (a, b) => a + b }, '-': { s: '−', fala: 'menos', f: (a, b) => a - b }, 'x': { s: '×', fala: 'vezes', f: (a, b) => a * b } };

function sortear(n, gera) {

  for (let t = 0; out.length < n && t < 200; t++) { const p = gera(); const k = textoConta(p); if (vistos.has(k) && t < 150) continue; vistos.add(k); out.push(p); }

function dezenas(op, forma, troca, nivel) {
  return () => {
    for (;;) {
      let a, b;
      if (forma === 'du') { a = rnd(nivel ? 21 : 11, 89); b = rnd(1, 9); }
      else if (forma === 'dd') { a = rnd(nivel ? 21 : 11, 89); b = rnd(11, op === '-' ? a - 1 : 88); }
      else { a = rnd(nivel ? 210 : 110, 899); b = rnd(nivel >= 2 ? 101 : 11, op === '-' ? a - 1 : 899 - a > 101 ? 899 - a : 101); }
      if (op === '-' && b >= a) continue;
      const r = op === '+' ? a + b : a - b; if (r <= 0 || r > 999) continue;
      const ua = a % 10, ub = b % 10;
      const tem = op === '+' ? ua + ub >= 10 : ua < ub;
      if (forma === 'ddd') { if (nivel === 0 && (tem || (op === '+' ? (Math.floor(a / 10) % 10 + Math.floor(b / 10) % 10 >= 10) : (Math.floor(a / 10) % 10 < Math.floor(b / 10) % 10)))) continue; }
      else if (tem !== troca) continue;
      if (forma === 'dd' && !troca && op === '+' && Math.floor(a / 10) + Math.floor(b / 10) > 9) continue;
      if (forma === 'dd' && troca && op === '+' && a + b > 99) continue;
      return { a, b, op };
    }
  };
}

function dica(p) {
  const a = p.a, b = p.b, op = p.op || '+';
  if (op === 'x') {
    if (b <= 5) return 'Dica: ' + a + ' × ' + b + ' é somar o ' + a + ' ' + b + (b === 1 ? ' vez' : ' vezes') + ': ' + Array(b).fill(a).join(' + ') + '.';
    return 'Dica: ' + a + ' × ' + (b - 1) + ' = ' + a * (b - 1) + '. Agora é só somar mais ' + a + '.';
  }
  if (op === '-') {
    if (a <= 20) return 'Dica: comece no ' + a + ' e volte ' + b + '. Ou pense: ' + b + ' mais quanto dá ' + a + '?';
    if (a % 10 < b % 10) return 'Dica: comece pelas unidades. ' + (a % 10) + ' é menor que ' + (b % 10) + ', então pegue 1 dezena emprestada: vira ' + (a % 10 + 10) + ' − ' + (b % 10) + '.';
    return 'Dica: tire as unidades primeiro (' + (a % 10) + ' − ' + (b % 10) + ') e depois as dezenas.';
  }
  const s = a + b, g = Math.max(a, b), q = Math.min(a, b);
  if (s <= 20) {
    if (s > 10 && g < 10) { const f = 10 - g; return 'Dica: complete o 10. ' + g + ' + ' + f + ' = 10, e ainda faltam ' + (q - f) + '.'; }
    return 'Dica: comece no ' + g + ' e conte mais ' + q + (q <= 5 ? ' nos dedinhos.' : '.');
  }
  if (a % 10 + b % 10 >= 10) return 'Dica: some as unidades: ' + (a % 10) + ' + ' + (b % 10) + ' = ' + (a % 10 + b % 10) + '. Fica o ' + ((a + b) % 10) + ' e vai um para as dezenas.';
  return 'Dica: some as unidades (' + (a % 10) + ' + ' + (b % 10) + ') e depois as dezenas.';
}

  const ta = String(fd.get('anual') || '').trim().replace(/[^\d,\.]/g, '');
  const anual = Number(ta.indexOf(',') >= 0 ? ta.replace(/\./g, '').replace(',', '.') : ta);
  const fundador = String(fd.get('fundador') || '').trim();
  if (!isFinite(num) || num < 1) { adminMsg = { t: 'Preço inválido. Exemplo: 49,90' }; return render(); }
  if (!isFinite(anual) || anual < 1) { adminMsg = { t: 'Preço anual inválido. Exemplo: 297,00' }; return render(); }
  if (fundador && !/^\d{4}-\d{2}-\d{2}$/.test(fundador)) { adminMsg = { t: 'Data da oferta de fundador inválida.' }; return render(); }
  if (!Number.isInteger(dias) || dias < 0 || dias > 60) { adminMsg = { t: 'Dias de teste: um número de 0 a 60.' }; return render(); }
  adminOcupado = true; adminMsg = null; render();
  try {
    const r = await NUVEM.funcao('admin-cobranca', { acao: 'salvar', preco_centavos: Math.round(num * 100), preco_anual_centavos: Math.round(anual * 100), fundador_ate: fundador, dias_teste: dias, vendas_abertas: !!fd.get('abertas'), aplicar_atuais: !!fd.get('atuais') });

function resumo(c) {
  const desde = diaAntes(6);
  const sem = c.historico.filter(l => l.dia >= desde);
  const dias = new Set(sem.map(l => l.dia)).size;
  const itens = sem.flatMap(l => l.itens);
  const min = Math.round(sem.reduce((s, l) => s + l.ms, 0) / 60000);
  const pct = itens.length ? Math.round(100 * itens.filter(i => i.deprimeira).length / itens.length) : 0;
  const errosHab = {}; const errosConta = {};
  for (const l of c.historico.slice(-10)) for (const it of l.itens) if (!it.deprimeira) {
    errosHab[l.hab] = (errosHab[l.hab] || 0) + 1; const k = textoConta(it); errosConta[k] = (errosConta[k] || 0) + 1;
  }
  const pior = Object.keys(errosHab).sort((a, b) => errosHab[b] - errosHab[a])[0];
  const contas = Object.keys(errosConta).sort((a, b) => errosConta[b] - errosConta[a]).slice(0, 3);
  return { sem, dias, itens, min, pct, pior: pior == null ? null : Number(pior), contas };
}

/* ---------- Quadro de escrita ---------- */
let canetaVista = false;
function montarPad() {
  const pad = document.getElementById('pad'); if (!pad) return;
  const cv = pad.querySelector('canvas'), ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  function dim() { const r = pad.getBoundingClientRect(); padTam = { w: r.width, h: r.height }; cv.width = r.width * dpr; cv.height = r.height * dpr; desenhar(); }
  function desenhar() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, padTam.w, padTam.h);
    ctx.strokeStyle = '#1C2340'; ctx.fillStyle = '#1C2340'; ctx.lineWidth = Math.max(7, padTam.h * 0.045); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const s of tracos) {
      const p = toPx(s, padTam.w, padTam.h);
      if (p.length === 1) { ctx.beginPath(); ctx.arc(p[0][0], p[0][1], ctx.lineWidth / 2, 0, 7); ctx.fill(); continue; }
      ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]); ctx.stroke();
    }
  }
  dim();
  const trava = () => licao && (licao.status === 'ok' || licao.status === 'revela' || licao.status === 'duvida');
  let atual = null, idPonteiro = null;
  function pt(e) { const r = cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * 1000), Math.round((e.clientY - r.top) / r.height * 1000), Date.now() - licao.inicioItem]; }
  cv.addEventListener('pointerdown', e => {
    if (trava()) return;
    if (e.pointerType === 'pen') canetaVista = true;
    if (canetaVista && e.pointerType === 'touch') return; // rejeição de palma
    if (idPonteiro !== null) return;
    e.preventDefault(); cv.setPointerCapture(e.pointerId); idPonteiro = e.pointerId;
    if (licao.status === 'erro' || licao.status === 'aviso') { licao.status = 'escrever'; const av = app.querySelector('.aviso'); if (av) av.outerHTML = '<p class="instrucao">Escreva o resultado no quadradinho e toque em Conferir.</p>'; pad.classList.remove('erro'); }
    const dp = pad.querySelector('.dica-pad'); if (dp) dp.remove();
    atual = [pt(e)]; tracos.push(atual); desenhar();
  });
  cv.addEventListener('pointermove', e => {
    if (e.pointerId !== idPonteiro || !atual) return;
    const ev = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const x of ev) atual.push(pt(x));
    desenhar();
  });
  const fim = e => { if (e.pointerId !== idPonteiro) return; idPonteiro = null; atual = null; };
  cv.addEventListener('pointerup', fim); cv.addEventListener('pointercancel', fim);
  window.onresize = () => { if (document.getElementById('pad') === pad) dim(); };
}

/* ---------- Lógica da lição ---------- */
function avaliar(valor) {
  const L = licao, p = L.probs[L.i], soma = resultado(p);
  L.tentativas.push({ valor, tracos: tracos.slice(), aspecto: padTam.w / padTam.h });
  if (valor === soma) { L.status = 'ok'; falar(L.tentativas.length === 1 ? 'Acertou!' : 'Isso! Acertou!'); }
  else if (L.tentativas.length >= 3) { L.status = 'revela'; falar(falaConta(p) + ' é ' + soma); }
  else { L.status = 'erro'; tracos = []; L.digitado = ''; falar('Quase! Vamos de novo?'); }
  render();
}

function fecharItem() {
  const L = licao, p = L.probs[L.i];
  L.itens.push({ a: p.a, b: p.b, op: p.op || '+', deprimeira: L.tentativas.length === 1 && L.status === 'ok', acertou: L.status === 'ok', ms: Date.now() - L.inicioItem, tentativas: L.tentativas.map(t => ({ v: t.valor, t: t.tracos, r: Math.round(t.aspecto * 100) / 100 })) });
}

function terminarLicao() {
  const c = crianca(), L = licao;
  if (!c) { licao = null; tracos = []; return ir(db.criancas.length ? 'perfis' : 'boasvindas'); }
  const dp = L.itens.filter(i => i.deprimeira).length;
  const estrelas = dp === 5 ? 3 : dp >= 4 ? 2 : 1;
  const d = hoje();
  const passou = dp >= 4; let subiu = false, terminouTudo = false;
  let novoBloco = false;
  if (passou && L.hab === c.hab && c.nivel < etapa(c.hab).licoes) {
    c.nivel++;
    if (c.nivel >= etapa(c.hab).licoes) { if (c.hab < ETAPAS.length - 1) { const b0 = etapa(c.hab).bloco; c.hab++; c.nivel = 0; novoBloco = etapa(c.hab).bloco !== b0; } else terminouTudo = true; subiu = true; }
    marcar(c);
  }
  c.historico.push({ id: novoId('lic'), ts: Date.now(), dia: d, hab: L.hab, itens: L.itens, ms: Date.now() - L.inicio, estrelas, sinc: false });
  recalcular(c); salvar(); agendarSinc(400);
  fimInfo = { deprimeira: dp, estrelas, passou, subiu, terminouTudo, novoBloco };
  licao = null; tracos = [];
  ir('fim');
  falar('Lição feita! Você ganhou ' + estrelas + (estrelas === 1 ? ' estrela' : ' estrelas'));
}

/* ---------- Replay ---------- */
function abrirReplay(id) {
  const c = db.criancas.find(x => x.id === paisAba); const l = c && c.historico.find(x => x.id === id); if (!l) return;
  modal = function () {
    return '<div class="modal" role="dialog" aria-modal="true" aria-label="Replay da lição"><div class="caixa"><div class="topo"><h2 style="font-size:22px">Replay · ' + esc(etapa(l.hab).nome) + ' · ' + dataBonita(l.dia) + '</h2><button class="btn btn-claro btn-pequeno" data-act="fecharModal" data-foco>Fechar</button></div>' +
      '<div class="replays">' + l.itens.map((it, i) => {
        const ult = it.tentativas[it.tentativas.length - 1];
        return '<div class="replay"><p style="margin:0;font-size:18px;font-weight:900">' + textoConta(it) + ' = ' + resultado(it) + '</p>' +
          (ult && ult.t && ult.t.length ? '<canvas data-rp="' + i + '"></canvas>' : '<p class="peq" style="margin:0">' + (ult ? 'Respondeu pelo teclado: ' + ult.v : 'Sem traçado salvo') + '</p>') +
          '<p class="peq" style="margin:0">' + (it.deprimeira ? '<span class="ok-txt">Acertou de primeira</span>' : it.acertou ? '<span class="erro-txt">Acertou na ' + it.tentativas.length + 'ª tentativa</span>' : '<span class="erro-txt">Não acertou</span>') +
          ' · respostas: ' + it.tentativas.map(t => t.v).join(', ') + ' · ' + Math.round(it.ms / 1000) + ' s</p></div>';
      }).join('') + '</div><button class="btn btn-laranja btn-pequeno" data-act="replayDeNovo">Ver de novo</button></div></div>';
  };
  modal.depois = function () {
    app.querySelectorAll('canvas[data-rp]').forEach(cv => {
      const it = l.itens[Number(cv.dataset.rp)], t = it.tentativas[it.tentativas.length - 1];
      const dpr = window.devicePixelRatio || 1, r = cv.getBoundingClientRect(); cv.width = r.width * dpr; cv.height = r.height * dpr;
      const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const h = r.height, w = Math.min(r.width, h * (t.r || 1.5)), ox = (r.width - w) / 2;
      const t0 = Math.min.apply(null, t.t.map(s => s[0] ? s[0][2] : 1e12));
      const tf = Math.max.apply(null, t.t.map(s => s.length ? s[s.length - 1][2] : 0));
      const ini = performance.now();
      (function quadro(now) {
        const el = Math.min((now - ini) * 1.5 + t0, tf);
        ctx.clearRect(0, 0, r.width, h); ctx.strokeStyle = '#2F4BC7'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        for (const s of t.t) { const vis = s.filter(p => p[2] <= el); if (!vis.length) continue; ctx.beginPath(); ctx.moveTo(ox + vis[0][0] * w / 1000, vis[0][1] * h / 1000); for (const p of vis) ctx.lineTo(ox + p[0] * w / 1000, p[1] * h / 1000); ctx.stroke(); }
        if (el < tf && document.body.contains(cv)) requestAnimationFrame(quadro);
      })(ini);
    });
  };
  render();
}

  e.preventDefault(); const fd = new FormData(e.target);
  if (e.target.dataset.form === 'perfil') {
    const nome = String(fd.get('nome') || '').trim().slice(0, 20); if (!nome) return;
    db.consentimento = true;
    const c = { id: novoId('cri'), nome, cor: String(fd.get('cor') || CORES[0]), hab: 0, nivel: 0, estrelas: 0, estrelasArq: 0, sequencia: 0, ultimoDia: null, teclado: false, reinicio: 0, atualizado: Date.now(), sujo: true, sinc: false, historico: [] };
    db.criancas.push(c); db.ativa = c.id; salvar(); agendarSinc(0); paisAba = null; ir('inicio');
  } else if (e.target.dataset.form === 'aceite') { enviarAceite(fd);
  } else if (e.target.dataset.form === 'conta') { enviarConta(fd);
  } else if (e.target.dataset.form === 'admin') { enviarAdmin(fd);
  } else if (e.target.dataset.form === 'assinar') { enviarAssinar(fd);
  } else if (e.target.dataset.form === 'portao') {
    if (Number(fd.get('r')) === desafio.a * desafio.b) { paisAba = db.ativa || (db.criancas[0] && db.criancas[0].id); ir('pais'); }
    else { desafio = { a: 6 + Math.floor(Math.random() * 4), b: 6 + Math.floor(Math.random() * 4), erro: true }; render(); }
  }
});
app.addEventListener('keydown', e => { if (e.key === 'Escape' && modal) { modal = null; render(); } });

window.PINGO_TEST = { recognize, rasterize, NET, novaLicao, dica, mesclar, temAcesso, ETAPAS, BLOCOS, resultado, salvar, get db() { return db; } };
window.addEventListener('online', () => agendarSinc(200));
window.addEventListener('offline', () => { db.estadoSinc = 'offline'; atualizarSelo(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') agendarSinc(1000); });
checarRetornoPagamento();
render();
iniciarNuvem();
if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
